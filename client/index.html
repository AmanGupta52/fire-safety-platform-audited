<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Safety Platform — Fire Extinguishers, AMC & Safety Services</title>
    <meta name="description" content="Buy fire extinguishers and safety equipment, book installation, refilling, inspection and fire safety audits, and manage AMC contracts — all in one place." />
    <meta name="theme-color" content="#1A1D1F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved/system theme before first paint so there is no light-to-dark flash, and so pages
      // without a theme toggle (like the login screen) still follow it.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
