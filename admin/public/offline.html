<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C1272D" />
    <title>Offline · Technician Portal</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #1b2027; color: #f1f5f9; text-align: center; padding: 24px; }
      main { max-width: 360px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #94a3b8; line-height: 1.5; margin: 0 0 20px; }
      button { background: #c1272d; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Job details are private and are only loaded when you have a connection. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
